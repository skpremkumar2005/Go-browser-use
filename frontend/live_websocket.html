<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Browser Stream - WebSocket</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .browser-container {
        position: relative;
        max-width: 100%;
        max-height: 100%;
        border: 1px solid #333;
        background: #111;
      }

      #browserCanvas {
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
        display: block;
        background: #222;
      }

      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .loading-content {
        text-align: center;
        color: #fff;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .status {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 100;
      }

      .status.connected {
        color: #4caf50;
      }

      .status.connecting {
        color: #ff9800;
      }

      .status.error {
        color: #f44336;
      }

      .fps-counter {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 11px;
        color: #4caf50;
        z-index: 100;
      }

      .error-message {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(244, 67, 54, 0.9);
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        max-width: 80%;
        text-align: center;
        z-index: 1001;
      }

      .info-panel {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 10px;
        color: #aaa;
        z-index: 100;
        max-width: 200px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="browser-container">
        <canvas id="browserCanvas"></canvas>
        <div id="loadingOverlay" class="loading-overlay">
          <div class="loading-content">
            <div class="spinner"></div>
            <div id="loadingText">Connecting to WebSocket stream...</div>
          </div>
        </div>
        <div id="status" class="status connecting">Connecting...</div>
        <div id="fpsCounter" class="fps-counter" style="display: none">
          FPS: 0
        </div>
        <div id="infoPanel" class="info-panel" style="display: none">
          <div>Frames: <span id="frameCount">0</span></div>
          <div>Errors: <span id="errorCount">0</span></div>
          <div>Size: <span id="frameSize">0x0</span></div>
        </div>
      </div>
    </div>

    <script>
      // Get sessionId from URL path OR use fallback methods
      let sessionId = window.location.pathname.split("/").pop();
      
      // Template-provided WebSocket URL (if available from Go template)
      let websocketUrl = `ws://${window.location.host}/api/v1/browser_use/browser/websocket-stream/${sessionId}`;
      
      console.log("🎥 Initializing WebSocket stream for session:", sessionId);
      console.log("🔗 Full URL path:", window.location.pathname);
      console.log("🔗 URL segments:", window.location.pathname.split("/"));
      console.log("🔗 WebSocket URL:", websocketUrl);

      // Function to get the current active session from the backend
      async function getActiveSession() {
        try {
          const response = await fetch(`http://${window.location.host}/api/v1/browser_use/browser/active-session`);
          if (response.ok) {
            const data = await response.json();
            if (data.success && data.data.sessionId) {
              console.log("🎯 Found active session from backend:", data.data.sessionId);
              return {
                sessionId: data.data.sessionId,
                websocketUrl: data.data.websocket_url,
                liveUrl: data.data.live_url
              };
            }
          }
        } catch (error) {
          console.warn("⚠️ Could not fetch active session:", error);
        }
        return null;
      }

      // DOM elements
      const canvas = document.getElementById("browserCanvas");
      const ctx = canvas.getContext("2d");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");
      const status = document.getElementById("status");
      const fpsCounter = document.getElementById("fpsCounter");
      const infoPanel = document.getElementById("infoPanel");
      const frameCount = document.getElementById("frameCount");
      const errorCount = document.getElementById("errorCount");
      const frameSize = document.getElementById("frameSize");

      // WebSocket configuration
      // Use the WebSocket URL we constructed earlier

      // State variables
      let websocket = null;
      let isConnected = false;
      let reconnectCount = 0;
      let maxReconnects = 10;
      let reconnectDelay = 2000;
      let frameCounter = 0;
      let errorCounter = 0;
      let lastFrameTime = 0;
      let fpsHistory = [];
      let currentFPS = 0;

      // Canvas state
      let canvasWidth = 1200;
      let canvasHeight = 800;

      // User interaction state
      let isPointerDown = false;
      let pointerId = null;
      let lastSentMove = 0;

      // Initialize canvas
      function initializeCanvas() {
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // Draw initial loading message
        ctx.fillStyle = "#666";
        ctx.font = "16px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          "Waiting for WebSocket connection...",
          canvasWidth / 2,
          canvasHeight / 2
        );
      }

      // Setup browser interactions (mouse, keyboard, scroll)
      function setupBrowserInteractions() {
        console.log("🎮 Setting up browser interactions");

        // Mouse/pointer events
        canvas.addEventListener("pointerdown", handlePointerDown);
        canvas.addEventListener("pointermove", handlePointerMove);
        canvas.addEventListener("pointerup", handlePointerUp);
        canvas.addEventListener("pointercancel", handlePointerCancel);

        // Scroll events
        canvas.addEventListener("wheel", handleBrowserScroll, {
          passive: false,
        });

        // Prevent context menu
        canvas.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });

        // Keyboard events
        window.addEventListener("keydown", handleBrowserKeydown);

        console.log("✅ Browser interactions initialized");
      }

      // Coordinate mapping from canvas to browser viewport
      function mapClientToPageCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();

        // canvas uses object-fit: contain; compute the actual displayed image size
        const img = canvas;
        const naturalWidth = img.naturalWidth || rect.width;
        const naturalHeight = img.naturalHeight || rect.height;

        // Compute scale used by object-fit: contain
        const scale = Math.min(
          rect.width / naturalWidth,
          rect.height / naturalHeight
        );
        const renderedWidth = naturalWidth * scale;
        const renderedHeight = naturalHeight * scale;

        // Compute offset within the element due to contain centering
        const offsetX = rect.left + (rect.width - renderedWidth) / 2;
        const offsetY = rect.top + (rect.height - renderedHeight) / 2;

        // Compute coordinates relative to the remote page viewport
        const x = (clientX - offsetX) / scale;
        const y = (clientY - offsetY) / scale;

        return { x: Math.max(0, Math.round(x)), y: Math.max(0, Math.round(y)) };
      }

      // Pointer event handlers
      function handlePointerDown(e) {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        isPointerDown = true;
        pointerId = e.pointerId;

        const coords = mapClientToPageCoords(e.clientX, e.clientY);
        executeAction("mousedown", {
          x: coords.x,
          y: coords.y,
          button: e.button || 0,
          timestamp: Date.now(),
        });
        console.log(
          `🖱️ pointerdown -> page coords: (${coords.x}, ${coords.y})`
        );
      }

      function handlePointerMove(e) {
        // Only send moves when pointer is active (drag) or occasionally when hovering
        if (!canvas.naturalWidth) return; // no frame yet
        const now = performance.now();
        // Throttle to ~60fps using requestAnimationFrame & time check
        if (now - lastSentMove < 8) return;
        lastSentMove = now;

        const coords = mapClientToPageCoords(e.clientX, e.clientY);
        if (isPointerDown) {
          // Dragging
          executeAction("mousemove", {
            x: coords.x,
            y: coords.y,
            buttons: e.buttons || 1,
            timestamp: Date.now(),
          });
        } else {
          // Hover move - send less frequently
          if (!e._lastHover || now - e._lastHover > 200) {
            e._lastHover = now;
            executeAction("mousemove", {
              x: coords.x,
              y: coords.y,
              buttons: 0,
              timestamp: Date.now(),
            });
          }
        }
      }

      function handlePointerUp(e) {
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (err) {}
        const coords = mapClientToPageCoords(e.clientX, e.clientY);
        executeAction("mouseup", {
          x: coords.x,
          y: coords.y,
          button: e.button || 0,
          timestamp: Date.now(),
        });
        // Fire a click action for compatibility
        executeAction("click", {
          x: coords.x,
          y: coords.y,
          button: e.button || 0,
          timestamp: Date.now(),
        });
        isPointerDown = false;
        pointerId = null;
        console.log(`🖱️ pointerup -> page coords: (${coords.x}, ${coords.y})`);
      }

      function handlePointerCancel(e) {
        if (isPointerDown) {
          try {
            canvas.releasePointerCapture(e.pointerId);
          } catch (err) {}
          isPointerDown = false;
          pointerId = null;
        }
      }

      // Scroll handler
      function handleBrowserScroll(event) {
        event.preventDefault();
        const deltaY = event.deltaY;
        const deltaX = event.deltaX;

        executeAction("scroll", {
          deltaX: Math.round(deltaX / 3),
          deltaY: Math.round(deltaY / 3),
          direction:
            deltaY > 0
              ? "down"
              : deltaY < 0
              ? "up"
              : deltaX > 0
              ? "right"
              : "left",
          timestamp: Date.now(),
        });
      }

      // Keyboard handler
      function handleBrowserKeydown(event) {
        const activeElement = document.activeElement;
        const isTextInput =
          activeElement &&
          (activeElement.tagName === "INPUT" ||
            activeElement.tagName === "TEXTAREA" ||
            activeElement.contentEditable === "true");

        // Special keys that should always be handled
        const specialKeys = [
          "Escape",
          "Tab",
          "Enter",
          "Backspace",
          "Delete",
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          "Home",
          "End",
          "PageUp",
          "PageDown",
        ];

        if (
          specialKeys.includes(event.key) ||
          event.ctrlKey ||
          event.altKey ||
          event.metaKey
        ) {
          if (!isTextInput) {
            event.preventDefault();
          }

          executeAction("key", {
            key: event.key,
            ctrlKey: event.ctrlKey,
            altKey: event.altKey,
            shiftKey: event.shiftKey,
            metaKey: event.metaKey,
            timestamp: Date.now(),
          });
        } else if (!isTextInput) {
          // Regular typing
          event.preventDefault();

          executeAction("type", {
            text: event.key,
            timestamp: Date.now(),
          });
        }
      }

      // Execute action via WebSocket
      function executeAction(action, data) {
        if (websocket && websocket.readyState === WebSocket.OPEN) {
          const message = {
            type: "action",
            taskId: sessionId,
            action: action,
            data: data,
          };
          websocket.send(JSON.stringify(message));
          console.log(`🎯 Executed ${action}:`, data);
        } else {
          console.warn("⚠️ WebSocket not connected, action not sent");
        }
      }

      // WebSocket connection management with automatic session recovery
      async function connectWebSocket() {
        if (websocket && websocket.readyState === WebSocket.CONNECTING) {
          console.log("⚠️ WebSocket connection already in progress");
          return;
        }

        if (websocket && websocket.readyState === WebSocket.OPEN) {
          console.log("⚠️ WebSocket already connected");
          return;
        }

        console.log(
          `🔗 Connecting to WebSocket (attempt ${reconnectCount + 1})...`
        );
        showStatus("Connecting...", "connecting");
        showLoadingOverlay(
          `Connecting... (${reconnectCount + 1}/${maxReconnects + 1})`
        );

        try {
          websocket = new WebSocket(websocketUrl);
          websocket.binaryType = "arraybuffer";

          websocket.onopen = function () {
            console.log("✅ WebSocket connected");
            isConnected = true;
            reconnectCount = 0;
            errorCounter = 0;
            showStatus("Connected", "connected");
            hideLoadingOverlay();
            showInfoPanel();

            // Send initial handshake
            const handshake = JSON.stringify({
              type: "handshake",
              sessionId: sessionId,
              timestamp: Date.now(),
            });
            websocket.send(handshake);
          };

          websocket.onmessage = function (event) {
            if (typeof event.data === "string") {
              // Handle JSON messages
              try {
                const data = JSON.parse(event.data);
                handleTextMessage(data);
              } catch (e) {
                console.warn("⚠️ Failed to parse message:", e);
              }
            } else if (event.data instanceof ArrayBuffer) {
              // Handle binary frame data
              handleBinaryFrame(event.data);
            }
          };

          websocket.onclose = function (event) {
            console.log(
              `🔌 WebSocket closed (code: ${event.code}, reason: ${event.reason})`
            );
            isConnected = false;
            
            // If we get a 404 or session not found error, try to get active session
            if (event.code === 1006 || event.reason.includes("not found")) {
              handleSessionNotFound();
            } else {
              handleDisconnection();
            }
          };

          websocket.onerror = function (error) {
            console.error("❌ WebSocket error:", error);
            errorCounter++;
            updateInfoPanel();
          };
        } catch (error) {
          console.error("❌ Failed to create WebSocket:", error);
          handleDisconnection();
        }
      }

      // Handle session not found by trying to get active session
      async function handleSessionNotFound() {
        console.log("🔄 Session not found, trying to get active session...");
        
        const activeSessionData = await getActiveSession();
        if (activeSessionData && activeSessionData.sessionId !== sessionId) {
          console.log(`🎯 Switching from ${sessionId} to active session ${activeSessionData.sessionId}`);
          
          // Update session ID and WebSocket URL
          sessionId = activeSessionData.sessionId;
          websocketUrl = activeSessionData.websocketUrl;
          
          // Update URL in browser without reload
          if (history.pushState) {
            const newUrl = activeSessionData.liveUrl.replace(`http://${window.location.host}`, '');
            history.pushState({}, '', newUrl);
          }
          
          // Reset reconnect count and try again
          reconnectCount = 0;
          
          setTimeout(() => {
            connectWebSocket();
          }, 1000);
        } else {
          // No active session found, handle as normal disconnection
          handleDisconnection();
        }
      }

      // Handle text messages
      function handleTextMessage(data) {
        console.log("📨 Text message:", data);

        switch (data.type) {
          case "connected":
            console.log("🎉 Stream started for session:", data.sessionId);
            break;
          case "error":
            console.error("❌ Server error:", data.message);
            showError(`Server error: ${data.message}`);
            break;
          case "stream_ended":
            console.log("📺 Stream ended:", data.reason);
            showError(`Stream ended: ${data.reason}`);
            break;
          case "action_ack":
            console.log("✅ Action acknowledged:", data.action);
            // Optional: Show brief visual feedback for successful actions
            break;
          case "action_error":
            console.error("❌ Action failed:", data.message);
            showError(`Action failed: ${data.message}`);
            break;
        }
      }

      // Handle binary frame data
      function handleBinaryFrame(arrayBuffer) {
        try {
          frameCounter++;
          updateFPS();

          // Create blob and load as image
          const blob = new Blob([arrayBuffer], { type: "image/jpeg" });
          const img = new Image();

          img.onload = function () {
            // Auto-resize canvas if needed
            if (img.width !== canvasWidth || img.height !== canvasHeight) {
              canvasWidth = img.width;
              canvasHeight = img.height;
              canvas.width = canvasWidth;
              canvas.height = canvasHeight;
              console.log(
                `📐 Canvas resized to ${canvasWidth}x${canvasHeight}`
              );
            }

            // Draw frame to canvas
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(img, 0, 0);

            updateInfoPanel();

            // Cleanup
            URL.revokeObjectURL(img.src);
          };

          img.onerror = function () {
            console.warn("⚠️ Failed to load frame image");
            errorCounter++;
            updateInfoPanel();
          };

          // Create object URL for image
          img.src = URL.createObjectURL(blob);
        } catch (error) {
          console.error("❌ Frame processing error:", error);
          errorCounter++;
          updateInfoPanel();
        }
      }

      // Handle WebSocket disconnection
      function handleDisconnection() {
        isConnected = false;
        hideInfoPanel();

        if (reconnectCount < maxReconnects) {
          reconnectCount++;
          const delay = Math.min(reconnectDelay * reconnectCount, 10000);

          showStatus(
            `Reconnecting... (${reconnectCount}/${maxReconnects})`,
            "connecting"
          );
          showLoadingOverlay(
            `Reconnecting in ${
              delay / 1000
            }s... (${reconnectCount}/${maxReconnects})`
          );

          setTimeout(() => {
            if (!isConnected) {
              connectWebSocket();
            }
          }, delay);
        } else {
          showStatus("Connection Failed", "error");
          showError(
            "Max reconnection attempts reached. Please refresh the page."
          );
        }
      }

      // FPS calculation
      function updateFPS() {
        const now = performance.now();
        if (lastFrameTime > 0) {
          const frameDelta = now - lastFrameTime;
          const fps = 1000 / frameDelta;

          fpsHistory.push(fps);
          if (fpsHistory.length > 10) {
            fpsHistory.shift();
          }

          // Calculate average FPS
          currentFPS = Math.round(
            fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length
          );

          if (fpsCounter) {
            fpsCounter.textContent = `FPS: ${currentFPS}`;
          }
        }
        lastFrameTime = now;
      }

      // UI helper functions
      function showLoadingOverlay(message = "Loading...") {
        if (loadingText) loadingText.textContent = message;
        if (loadingOverlay) loadingOverlay.style.display = "flex";
      }

      function hideLoadingOverlay() {
        if (loadingOverlay) loadingOverlay.style.display = "none";
      }

      function showStatus(message, type = "connecting") {
        if (status) {
          status.textContent = message;
          status.className = `status ${type}`;
        }
      }

      function showInfoPanel() {
        if (fpsCounter) fpsCounter.style.display = "block";
        if (infoPanel) infoPanel.style.display = "block";
      }

      function hideInfoPanel() {
        if (fpsCounter) fpsCounter.style.display = "none";
        if (infoPanel) infoPanel.style.display = "none";
      }

      function updateInfoPanel() {
        if (frameCount) frameCount.textContent = frameCounter;
        if (errorCount) errorCount.textContent = errorCounter;
        if (frameSize) frameSize.textContent = `${canvasWidth}x${canvasHeight}`;
      }

      function showError(message) {
        clearErrorMessage();
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-message";
        errorDiv.textContent = message;
        document.body.appendChild(errorDiv);

        // Auto-hide after 8 seconds
        setTimeout(() => {
          if (errorDiv.parentNode) {
            errorDiv.parentNode.removeChild(errorDiv);
          }
        }, 8000);
      }

      function clearErrorMessage() {
        const existing = document.querySelector(".error-message");
        if (existing) {
          existing.remove();
        }
      }

      // Handle page visibility changes
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          console.log("📱 Page hidden");
        } else {
          console.log("📱 Page visible");
          if (!isConnected) {
            console.log("🔄 Reconnecting after page focus");
            connectWebSocket();
          }
        }
      });

      // Handle window resize
      window.addEventListener("resize", function () {
        console.log("📐 Window resized");
        // Canvas will auto-resize based on incoming frames
      });

      // Keyboard shortcuts
      document.addEventListener("keydown", function (event) {
        if (event.key === "r" && event.ctrlKey) {
          event.preventDefault();
          console.log("🔄 Manual refresh requested");
          location.reload();
        }

        if (event.key === "i" && event.ctrlKey) {
          event.preventDefault();
          console.log("📊 Toggle info panel");
          const isVisible = infoPanel.style.display === "block";
          infoPanel.style.display = isVisible ? "none" : "block";
          fpsCounter.style.display = isVisible ? "none" : "block";
        }
      });

      // Cleanup on page unload
      window.addEventListener("beforeunload", function () {
        if (websocket) {
          websocket.close();
        }
      });

      // Initialize the application
      console.log("🚀 Initializing WebSocket Live Browser Stream");
      initializeCanvas();
      setupBrowserInteractions(); // Add user interaction setup
      showLoadingOverlay("Connecting to WebSocket stream...");

      // Start connection with session validation
      async function initializeConnection() {
        // First, try to validate current session or get active session
        console.log("🔍 Validating session ID before connecting...");
        
        try {
          // Test if current session exists by making a simple request
          const testResponse = await fetch(`http://${window.location.host}/api/v1/browser_use/browser/sessions/${sessionId}`);
          
          if (!testResponse.ok) {
            console.log("⚠️ Current session not found, getting active session...");
            const activeSessionData = await getActiveSession();
            
            if (activeSessionData && activeSessionData.sessionId !== sessionId) {
              console.log(`🎯 Switching to active session: ${activeSessionData.sessionId}`);
              sessionId = activeSessionData.sessionId;
              websocketUrl = activeSessionData.websocketUrl;
              
              // Update URL in browser without reload
              if (history.replaceState) {
                const newUrl = activeSessionData.liveUrl.replace(`http://${window.location.host}`, '');
                history.replaceState({}, '', newUrl);
              }
            }
          } else {
            console.log("✅ Session validation successful");
          }
        } catch (error) {
          console.warn("⚠️ Session validation failed, proceeding with original session:", error);
        }
        
        // Now connect with the validated/corrected session ID
        connectWebSocket();
      }

      // Start the initialization process
      setTimeout(() => {
        initializeConnection();
      }, 100);
    </script>
  </body>
</html>
